name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's own Python is used: no third-party action is run in this job.
      - name: Test
        run: |
          python3 --version
          python3 -W error -m unittest discover -s tests -v
          python3 -m compileall -q src
